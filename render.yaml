services:
  - type: web
    name: saas-agency
    runtime: node
    plan: starter # necessário para disco persistente (banco + arquivos)
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true # segredo forte gerado pelo Render
      # Token da porta de serviço (/api/admin) usada pelo painel central.
      # O Render gera um valor forte; leia-o em Environment para configurar o painel.
      - key: SERVICE_TOKEN
        generateValue: true
      - key: DB_PATH
        value: /var/data/agency.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Cloudflare R2 (armazenamento das mídias). Defina os valores na aba
      # Environment; se ficarem vazios, o sistema guarda no disco (padrão).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Meta (Instagram/Facebook) — publicação direta dos posts. Crie o app em
      # developers.facebook.com, adicione "Login do Facebook" + "Instagram
      # Graph API" e preencha os três aqui, na aba Environment. Enquanto
      # estiverem vazios, o sistema não publica sozinho e diz isso na tela.
      # META_REDIRECT_URI é o endereço do sistema + /api/integrations/meta/callback
      # e precisa ser IGUAL ao cadastrado no app da Meta.
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      # Só para app do tipo "Login do Facebook PARA EMPRESAS" (o que a Meta
      # cria hoje): o número da configuração onde ficam as permissões. Sem
      # ele, nesses apps, o token vem sem permissão de publicar.
      - key: META_CONFIG_ID
        sync: false
      # Endereço público — usado nos links de assinatura e pela Meta/Asaas.
      # O Render preenche sozinho com a URL do serviço.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: saas-agency
          property: host
