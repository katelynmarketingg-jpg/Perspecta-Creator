name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend — instalar e testar
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Frontend — instalar e buildar
        working-directory: client
        run: |
          npm ci
          npm run build
